# Corre el modelo con datos reales y publica los resultados en la rama "resultados"
# (resultados.json + gráficos). No toca main, así que no redepliega la app.
# Se ejecuta cuando cambia el código del modelo, cada lunes y viernes, o a mano (Actions → Run workflow).
name: Run model with real data
on:
  push:
    branches: [main]
    paths: ["src/**", "scripts/**", "requirements.txt", ".github/workflows/run_model.yml"]
  schedule:
    - cron: "17 13 * * 1,5"   # lunes y viernes 08:17 Ecuador
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -q -r requirements.txt
      - name: Run pipeline and export results
        run: python scripts/export_results.py results
      - name: Publish to branch "resultados"
        run: |
          cd results
          git init -q -b resultados
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Resultados del modelo con datos reales ($(date -u +%Y-%m-%d))"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" resultados
          echo "::notice title=Resultados publicados::Rama resultados actualizada"
